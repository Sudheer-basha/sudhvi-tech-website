  <body>
    <!-- Netlify form detection bots (SPA deployment compatibility) -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="botField" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="userType" />
      <input type="text" name="subject" />
      <input type="text" name="programInterest" />
      <textarea name="message"></textarea>
      <input type="text" name="botField" />
    </form>
    <form name="enrollment" method="POST" data-netlify="true" netlify-honeypot="botField" hidden>
      <input type="hidden" name="form-name" value="enrollment" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="city" />
      <input type="text" name="qualification" />
      <input type="text" name="college" />
      <input type="text" name="yearOfStudy" />
      <input type="text" name="course" />
      <input type="text" name="learningMode" />
      <input type="text" name="batchTiming" />
      <input type="text" name="primaryGoal" />
      <input type="text" name="projectSupport" />
      <input type="text" name="referral" />
      <textarea name="additionalNotes"></textarea>
      <input type="text" name="botField" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
